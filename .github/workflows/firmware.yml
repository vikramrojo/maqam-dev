# SPDX-License-Identifier: GPL-3.0-only
# Build the FM-1 firmware (build/felucca.fwsc) with the JieLi toolchain and run the host tests.
# The package is uploaded as an artifact of the run: Actions -> this run -> Artifacts (also linked
# from a pull request's Checks tab). Linux x86-64 runs the JieLi tools natively (no Docker).
# Every run builds the site (installer, editor, emulator) as an artifact, maqam-site-<sha>. The pages workflow
# (pages.yml) publishes main's at https://vikramrojo.github.io/maqam-dev/ and each open pull request's at
# .../pr/<number>/, where the installer offers every firmware the pull request builds.
name: firmware

on:
  push:
    branches: [main, "vikramrojo/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      JIELI_TOOLCHAIN: /home/runner/jieli/toolchain       # (actions/cache refuses paths with '..')
      AC79_SDK: /home/runner/fw-AC79_AIoT_SDK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: pip install Pillow

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The JieLi toolchain (clang 4.0.1 for pi32v2) and three files of the AC79 SDK (BUILDING.md).
      # tools/build.py checks the SDK files against their SHA-256, so a wrong download fails the build.
      - name: Cache toolchain and SDK files
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/jieli
            /home/runner/fw-AC79_AIoT_SDK
          key: jieli-toolchain-ac79-sdk-v1.2.1-2023-12-13
      - name: JieLi toolchain
        if: steps.deps.outputs.cache-hit != 'true'
        run: sh tools/get_toolchain.sh /home/runner/jieli
      - name: AC79 SDK (only cpu/wl82/tools)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |                                    # gitee.com sometimes resets connections from CI: retry
          for i in 1 2 3 4 5; do
            rm -rf "$AC79_SDK"
            git clone --depth 1 --filter=blob:none --sparse --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$AC79_SDK" &&
              git -C "$AC79_SDK" sparse-checkout set cpu/wl82/tools &&
              [ -f "$AC79_SDK/cpu/wl82/tools/uboot.boot" ] && exit 0
            echo "attempt $i failed; retrying in $((i * 20)) s"; sleep $((i * 20))
          done
          exit 1

      - name: Build the firmware
        run: |
          set -o pipefail
          sh build.sh 2>&1 | tee build.log
          ls -l build/felucca.fwsc build/felucca.bin
          mkdir -p dist && cp build/felucca.fwsc build/felucca.bin build/loader/ota.bin dist/   # (kept: later builds reuse build/)

      - name: Host tests
        id: tests
        continue-on-error: true            # the CPU-time entries vary with the runner; see the summary
        run: SOAK_MIN=1 sh tests/run_tests.sh 2>&1 | tee tests.log; exit "${PIPESTATUS[0]:-0}"
        shell: bash

      - name: Summary
        if: always()
        run: |
          {
            echo "## Firmware build"
            echo
            if [ -f dist/felucca.fwsc ]; then
              echo "- \`felucca.fwsc\`: $(stat -c %s dist/felucca.fwsc) bytes, sha256 \`$(sha256sum dist/felucca.fwsc | cut -c1-16)…\`"
            else
              echo "- **No firmware: the build failed** (see the log)."
            fi
            echo "- Host tests: ${{ steps.tests.outcome }}"
            echo
            echo '```'
            grep -E "pool|RAM|free|golden renders|over budget|ALL HOST TESTS|HOST TESTS FAILED|FAIL" build.log tests.log 2>/dev/null | tail -40
            echo '```'
            echo
            echo "Download: this run's **Artifacts** section (\`maqam-firmware-…\`), or a pull request's page (pages.yml). Install with the web installer, after a backup."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the firmware
        if: always() && hashFiles('dist/felucca.fwsc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: maqam-firmware-${{ github.sha }}
          path: |
            dist/felucca.fwsc
            dist/felucca.bin
            dist/ota.bin
            build.log
            tests.log
          if-no-files-found: warn
          retention-days: 30

      # maqam: a second package with the pressure bend built in (MAQAM_PRESS=1, openspec/changes/maqam-aftertouch-bend),
      # to try on the FM-1 (only where the source has it); not the default, and on previews only, never on main's site.
      # Without the parameter icons (FELUCCA_ICONS=0, upstream's switch): the default image leaves ~256 B of the
      # app's flash region (app.ld XIP), and the pressure code needs ~2 KB
      - name: Build the pressure-bend test firmware (MAQAM_PRESS=1)
        id: press
        if: hashFiles('firmware/hal/fm1_press.h') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          MAQAM_PRESS=1 FELUCCA_ICONS=0 sh build.sh 2>&1 | tee build-press.log
          mkdir -p press && cp build/felucca.fwsc press/maqam-press.fwsc && cp build-press.log press/
      - name: Upload the pressure-bend test firmware
        if: steps.press.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: maqam-press-firmware-${{ github.sha }}
          path: press
          retention-days: 30

      # The site: the installer with this build's firmware, the editor (protocol 11) and the emulator. On main: the
      # normal firmware (what pages.yml publishes at the root). Elsewhere (a branch, a pull request): a preview whose
      # installer lists every firmware this build made (tools/site_firmwares.py)
      - name: Build the site (installer, editor, emulator)
        env:
          PREVIEW_REF: ${{ github.head_ref || github.ref_name }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          sudo apt-get install -y -qq lld >/dev/null
          sh web/emu/build.sh
          v="2.6-maqam-${PREVIEW_SHA::7}"
          python3 web/make_site.py dist/felucca.fwsc "$v" site
          python3 tools/brand_site.py site
          if [ "$ON_MAIN" != true ] && [ -f press/maqam-press.fwsc ]; then
            python3 tools/site_firmwares.py site --title "Preview of $PREVIEW_REF @ ${PREVIEW_SHA::7}, not a release." \
              --base-label "Maqam" aft "Maqam AFT: the pressure-bend test build (no parameter icons)" \
              press/maqam-press.fwsc "2.6-maqam-aft-${PREVIEW_SHA::7}"
          elif [ "$ON_MAIN" != true ]; then
            python3 tools/site_firmwares.py site --title "Preview of $PREVIEW_REF @ ${PREVIEW_SHA::7}, not a release." --base-label "Maqam"
          fi
          ls -R site | head -40
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: maqam-site-${{ github.sha }}
          path: site
          retention-days: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 90 || 14 }}
